spring:
  application:
    name: transaction-monitoring-system
  datasource:
    url: jdbc:postgresql://localhost:5432/transaction_monitoring
    username: postgres
    password: postgres

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  servlet:
    multipart:
      enabled: true
      max-file-size: 5MB
      max-request-size: 5MB

app:
  admin:
    username: admin
    email: admin@fintech.com
    password: admin123
  jwt:
    secret: 404E635266556E826E3272357538782F413F4428472B4B6250645367566B5970
    expiration-ms: 86400000

logging:
  level:
    org.flyway: DEBUG

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui
    operator-sorter: method